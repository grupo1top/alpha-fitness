<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de Usuários | Alpha Fitness</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body class="body-index">

    <div class="bemvindo-index">

        <img class="logo-index" src="/img/ChatGPT Image 26 de mar. de 2026, 15_57_00 2.png" alt="logo alpha-fitness">

        <h2 class="bemvindo-texth1">Não tem uma conta?</h2>
        <p class="subtitulo-texth1">Crie uma conta<br>agora.</p>

        <button class="cadastrar-button" type="button" onclick="window.location.href='cadastro.html'">Cadastrar-se</button>

    </div>

    <div class="entrar-conta">

        <h1 class="titulo-index">Acesse sua conta</h1>
        <h2 class="subtitulo-index">Preencha seus dados</h2>

        <form>
    <label for="email"></label>
    <input 
        class="email-form-index"
        type="email" 
        id="email" 
        name="email" 
        placeholder="E-MAIL"
        required
    >

    <label for="senha"></label>
    <input 
        class="senha-form-index"
        type="password" 
        id="senha" 
        name="senha" 
        placeholder="SENHA"
        required
    >

    <button 

    class="botao-entrar-index"
    type="button"
    onclick="window.location.href='home.html'">Entrar
    
    </button>

</form>

    </div>



</body>

</html>
